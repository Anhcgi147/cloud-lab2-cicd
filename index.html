<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Lab 2 | CI/CD</title>
    <style>
      :root { font-family: Arial, sans-serif; color: #e2e8f0; background: #0f172a; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(90%, 720px); padding: 3rem; border: 1px solid #334155; border-radius: 20px; background: #172033; }
      h1 { margin: 0 0 1rem; color: #38bdf8; }
      p { line-height: 1.7; }
      .status { display: inline-block; padding: .5rem .8rem; border-radius: 999px; background: #064e3b; color: #a7f3d0; }
    </style>
  </head>
  <body>
    <main>
      <p class="status">CI/CD ready</p>
      <h1>Cloud Lab 2</h1>
      <p>Ứng dụng web tĩnh được kiểm tra và triển khai tự động qua GitHub Actions.</p>
    </main>
  </body>
</html>
